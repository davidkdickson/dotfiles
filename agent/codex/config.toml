# Personal defaults and local app integrations, symlinked to ~/.codex/config.toml.
# https://learn.chatgpt.com/docs/config-file/config-reference

# Keep the model selected by Codex; apply the same effort/output preferences as Claude.
model_reasoning_effort = "high"
model_verbosity = "low"

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
web_search = "live"

# Optional completion sound for standalone CLI installs. Leave disabled when the
# app owns `notify`, since replacing it would remove the app's notification hook.
# notify = ["bash", "/Users/daviddickson/.dotfiles/agent/codex/notify.sh"]

notify = ["/Users/daviddickson/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[tui]
alternate_screen = "always"
vim_mode_default = true
animations = true
notifications = true
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "branch-changes", "weekly-limit"]
status_line_use_colors = true

# Reuse the Apple Notes MCP server installed by Claude Desktop.
# Requires that extension to exist at this machine-specific path.
[mcp_servers.apple-notes]
command = "node"
args = ["/Users/daviddickson/Library/Application Support/Claude/Claude Extensions/ant.dir.ant.anthropic.notes/server/index.js"]

[mcp_servers.apple-notes.env]
HOME = "/Users/daviddickson"

# Existing desktop integrations and project state. Paths are machine-specific.
[desktop]
followUpQueueMode = "steer"

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/daviddickson/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/Users/daviddickson/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/daviddickson/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/daviddickson/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.901.51231"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/daviddickson/.codex/plugins/cache/openai-bundled/browser/26.901.51231/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/daviddickson/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false

[projects."/Users/daviddickson/.dotfiles"]
trust_level = "trusted"

[projects."/Users/daviddickson/workspace/opez"]
trust_level = "trusted"

[tui.model_availability_nux]
gpt-6-astra = 4
